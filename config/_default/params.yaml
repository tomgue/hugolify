_merge: deep
form:
  netlify: false # Set false to disable Netlify forms
  action: false # Replace by URL from formspree, fabform, kwes…

search:
  enable: true # Set true to enable search
  layout: modal # Also modal or drawer
  filter: true # Set true to add filters by type
  sort: true

css:
  darkmode: true
  preload: true
  print: true
  postcss: 'postcss/design-system'

# Admin
admin:
  cms: sveltiacms
  name: github
  repo: tomgue/hugolify
  preview: true
  netlify:
    identity: false
  collections:
    indexes:
      enable: false
