name: Deploy Hugolify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: 1.27.0
      HUGO_VERSION: 0.166.0
      NODE_VERSION: 24.21.0
      DART_SASS_VERSION: 1.77.8
      TZ: Europe/Paris
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create local tools directory
        run: mkdir -p "${HOME}/.local"

      - name: Install Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false  # ← SOLUTION

      - name: Cache Corepack
        uses: actions/cache@v6
        with:
          path: ~/.cache/corepack
          key: corepack-${{ env.NODE_VERSION }}-${{ hashFiles('package.json') }}
          restore-keys: corepack-

      - name: Enable Corepack
        run: |
          corepack enable
          YARN_VERSION=$(node -e "console.log(require('./package.json').packageManager.replace('yarn@', ''))")
          corepack prepare yarn@${YARN_VERSION} --activate
          corepack run yarn --version | grep -q "${YARN_VERSION}" || exit 1

      - name: Install Dart Sass
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: |
          if [[ ! -f .yarnrc.yml ]]; then
            echo "::error::Missing .yarnrc.yml"
            exit 1
          fi
          corepack run yarn install --immutable

      - name: Cache Hugo
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ hashFiles('**/content/**', '**/layouts/**', 'config/**') }}
          restore-keys: hugo-

      - name: Build
        run: hugo build --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5